
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jhenny Lais | Moda Feminina</title>
  <meta name="description" content="Compre a moda feminina Jhenny Lais na Shopee e no TikTok Shop. Aceitamos Pix e cartão.">
  <meta name="theme-color" content="#f00078">
  <link rel="icon" href="logo.jpg">

  <meta property="og:title" content="Jhenny Lais | Moda Feminina">
  <meta property="og:description" content="Compre direto na Shopee ou no TikTok Shop. Aceitamos Pix e cartão.">
  <meta property="og:image" content="https://algaranaventura-rgb.github.io/jhenny-lais/logo.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">

  <script>document.documentElement.classList.add('js');</script>

  <style>
    :root {
      --vinho-fundo: #f00078;
      --vinho: #b80058;
      --dourado: #ffd84a;
      --dourado-claro: #fff0a6;
      --rose: #ff70b5;
      --bege: #fff5e8;
      --texto-escuro: #750038;
      --fonte-titulo: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --fonte-corpo: "Jost", "Segoe UI", Roboto, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; }

    html { min-height: 100%; }

    body {
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      font-family: var(--fonte-corpo);
      color: var(--bege);
      background:
        radial-gradient(ellipse at 50% 30%, #ff4da6 0%, transparent 68%),
        var(--vinho-fundo);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .so-leitor {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .palco {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px calc(env(safe-area-inset-bottom, 0px) + 32px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* LOGO: começa grande no centro da tela e depois sobe e diminui */
    .logo {
      --tam: min(64vw, 250px);
      width: var(--tam);
      height: var(--tam);
      flex: none;
      border-radius: 50%;
      overflow: hidden;
      background: var(--vinho);
      box-shadow: 0 0 0 3px var(--dourado), 0 18px 40px rgba(0, 0, 0, 0.45);
      transition: width 0.9s ease, height 0.9s ease;
      animation:
        entrada 1.1s cubic-bezier(0.2, 0.7, 0.2, 1) both,
        brilho 2.6s ease-out 0.5s;
    }

    .logo img {
      display: block;
      width: 118%;
      max-width: none;
      margin: -9% 0 0 -9%;
    }

    .aberto .logo { --tam: 150px; }

    @keyframes entrada {
      from { opacity: 0; transform: scale(0.86); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes brilho {
      0%   { box-shadow: 0 0 0 3px var(--dourado), 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 0 rgba(255, 216, 74, 0); }
      45%  { box-shadow: 0 0 0 3px var(--dourado), 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 70px rgba(255, 216, 74, 0.55); }
      100% { box-shadow: 0 0 0 3px var(--dourado), 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 0 rgba(255, 216, 74, 0); }
    }

    /* AVISO DE PAGAMENTO */
    .pagamento {
      margin-top: 28px;
      text-align: center;
      animation: aparece 0.9s ease 0.9s both;
    }

    .pagamento p {
      font-family: var(--fonte-titulo);
      font-weight: 500;
      font-size: 1.45rem;
      color: var(--dourado-claro);
    }

    .formas {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      list-style: none;
      padding: 0;
    }

    .formas li {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px 7px 12px;
      border: 1.5px solid var(--dourado);
      border-radius: 999px;
      font-size: 0.95rem;
      color: var(--bege);
    }

    .formas svg { width: 18px; height: 18px; fill: var(--dourado); }

    @keyframes aparece {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* BOTÕES: aparecem depois da entrada */
    .conteudo {
      width: 100%;
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 0.9s ease, opacity 0.9s ease;
    }

    .conteudo-interno { min-height: 0; overflow: hidden; }

    .js .conteudo { grid-template-rows: 0fr; opacity: 0; }
    .js .conteudo-interno { visibility: hidden; }
    .js .aberto .conteudo { grid-template-rows: 1fr; opacity: 1; }
    .js .aberto .conteudo-interno { visibility: visible; }

    .links {
      list-style: none;
      padding: 0;
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .links a,
    .atalhos a {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 68px;
      padding: 12px 20px 12px 14px;
      border-radius: 14px;
      background: var(--bege);
      color: var(--texto-escuro);
      text-decoration: none;
      font-weight: 500;
      font-size: 1.05rem;
      border: 1.5px solid transparent;
      transition: border-color 0.2s, transform 0.2s;
    }

    .links a:hover,
    .atalhos a:hover {
      border-color: var(--dourado);
      transform: translateY(-2px);
    }

    .links .icone,
    .atalhos .icone {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--vinho);
      color: var(--dourado-claro);
    }

    .links .icone svg,
    .atalhos .icone svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Instagram, TikTok e WhatsApp no mesmo estilo grande da Shopee */
    .atalhos {
      list-style: none;
      padding: 0;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .atalhos li { flex: none; }

    a:focus-visible {
      outline: 3px solid var(--dourado-claro);
      outline-offset: 3px;
    }

    /* MAPA E LOCALIZAÇÃO DA LOJA */
    .mapa-loja {
      width: 100%;
      margin-top: 25px;
      text-align: center;
      animation: aparece 0.9s ease 1.1s both;
    }

    .mapa-loja h2 {
      color: var(--dourado-claro);
      font-family: var(--fonte-titulo);
      font-size: 1.6rem;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .mapa-link {
      display: block;
      overflow: hidden;
      border: 2px solid var(--dourado);
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
    }

    .mapa-link iframe {
      display: block;
      width: 100%;
      height: 230px;
      border: 0;
      pointer-events: none;
    }

    .mapa-abrir {
      display: block;
      margin-top: 12px;
      padding: 14px;
      border-radius: 14px;
      background: var(--vinho);
      border: 1.5px solid var(--dourado);
      color: var(--dourado-claro);
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.2s, background 0.2s;
    }

    .mapa-abrir:hover {
      transform: translateY(-2px);
      background: #920047;
    }

    .mapa-loja p {
      margin-top: 12px;
      color: var(--bege);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

    <div class="logo">
      <img src="logo.jpg" alt="Logo Jhenny Lais Moda Feminina">

    <div class="pagamento">

              <span class="icone">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.2 1.6 6L0 24l6.4-1.7a11.8 11.8 0 0 0 5.7 1.5h.1C18.7 23.8 24 18.5 24 12a11.8 11.8 0 0 0-3.5-8.5ZM12.1 21.8h-.1a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.8 1 1-3.7-.2-.4a9.8 9.8 0 1 1 8.5 4.7Zm5.4-7.3c-.3-.2-1.8-.9-2.1-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7.1a8 8 0 0 1-2.4-1.5 9 9 0 0 1-1.7-2.1c-.2-.3 0-.5.1-.6l.5-.6c.2-.2.2-.4.3-.6s0-.4 0-.6-.7-1.7-1-2.3c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.6.1-.9.4s-1.2 1.2-1.2 2.8 1.2 3.2 1.4 3.4 2.4 3.7 5.8 5.1c.8.3 1.4.5 1.9.6.8.2 1.5.2 2 .1.6-.1 1.8-.7 2.1-1.4s.3-1.3.2-1.4-.3-.2-.6-.4Z"/></svg>

            <a href="https://www.google.com/maps/dir/?api=1&destination=Rua+Rodrigues+dos+Santos+91%2C+Br%C3%A1s%2C+S%C3%A3o+Paulo%2C+SP"

        <!-- MAPA DA LOJA: FINAL DO SITE -->

             target="_blank"

            Rua Rodrigues dos Santos, 91<br>

      </div>

  </main>

  <script>
    (function () {
      var palco = document.getElementById('palco');
      var aberto = false;

      function abrir() {
        if (aberto) return;
        aberto = true;
        palco.classList.add('aberto');
      }

      var semMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (semMovimento) {
        abrir();
      } else {
        setTimeout(abrir, 3000);
        document.addEventListener('pointerdown', abrir, { once: true });
        document.addEventListener('keydown', abrir, { once: true });
      }
    })();
  </script>
</body>
</html>
